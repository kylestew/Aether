<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Aether Prototype</title>
        <style>
            body {
                margin: 0;
                background: #111;
                color: white;
                font-family: sans-serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }
            #controls {
                padding: 10px;
                background: #222;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 1;
            }

            #canvas-container {
                position: absolute;
                top: 70px; /* height of controls */
                bottom: 30px;
                left: 30px;
                right: 30px;
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;
            }

            canvas {
                display: block;
                background: black;
            }
        </style>
    </head>
    <body>
        <div id="controls">
            <!-- 
            <label for="timelineSlider">Time:</label>
            <input type="range" id="timelineSlider" min="0" max="10" step="0.01" value="0" />
        -->
            <button id="playPause">▶️</button>
            &nbsp;
            <button id="exportBtn">📹</button>
            &nbsp;
            <span id="timeLabel">0.00s</span>
        </div>
        <!--
        <span id="fpsDisplay" style="margin-left: 20px">FPS: --</span>
        -->
        <div id="canvas-container">
            <canvas id="output"></canvas>
        </div>

        <!-- <script type="module" src="main.js"></script> -->

        <!-- <script type="module" src="main_cga_sphere.js"></script> -->
        <!-- <script type="module" src="main_blob.js"></script> -->
        <!-- <script type="module" src="main_solids.js"></script> -->
        <script type="module" src="main_dither_anim.js"></script>
    </body>
</html>
