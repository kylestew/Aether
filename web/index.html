<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Aether WASM Demo</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="header">
            <h1>Aether WASM Demo</h1>
            <p>Rust-powered visual effects in the browser</p>
        </div>

        <div class="container">
            <div class="canvas-container">
                <canvas id="mainCanvas" width="800" height="600"></canvas>
                <div class="status" id="status">Ready</div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <h3>Engine Controls</h3>
                    <button id="initBtn">Initialize Engine</button>
                    <button id="playBtn" disabled>Play</button>
                    <button id="stopBtn" disabled>Stop</button>
                    <div class="control-row">
                        <label for="compositionSelect">Composition:</label>
                        <select id="compositionSelect">
                            <option value="simple">Simple Gradient</option>
                            <option value="complex">Gradient + Noise</option>
                            <option value="colorbars">Color Bars</option>
                        </select>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Layer Controls</h3>
                    <div class="control-row">
                        <label for="layerOpacity">Layer 0 Opacity: <span id="opacityValue">1.0</span></label>
                        <input type="range" id="layerOpacity" min="0" max="1" step="0.1" value="1" disabled />
                    </div>
                    <div class="control-row">
                        <label for="layer1Opacity">Layer 1 Opacity: <span id="opacity1Value">1.0</span></label>
                        <input type="range" id="layer1Opacity" min="0" max="1" step="0.1" value="1" disabled />
                    </div>
                </div>

                <div class="demo-section">
                    <h4>Generic Renderer Test</h4>
                    <p style="font-size: 0.8rem; color: #999; margin: 0 0 10px 0">
                        Zero-duplication system - uses existing Rust renderers directly
                    </p>
                    <button id="genericGradientBtn">Generic Gradient</button>
                    <button id="genericNoiseBtn">Generic Noise (animated)</button>
                </div>

                <div class="demo-section">
                    <h4>Legacy Renderer Test</h4>
                    <p style="font-size: 0.8rem; color: #999; margin: 0 0 10px 0">
                        Backward compatibility - original standalone renderers
                    </p>
                    <button id="gradientTestBtn">Legacy Gradient</button>
                    <button id="noiseTestBtn">Legacy Noise</button>
                    <div class="control-row">
                        <label for="gradientDirection">Direction:</label>
                        <select id="gradientDirection">
                            <option value="false">Vertical</option>
                            <option value="true">Horizontal</option>
                        </select>
                    </div>
                    <div class="control-row">
                        <label for="noiseSeed">Seed:</label>
                        <input type="number" id="noiseSeed" value="42" min="0" max="999999" />
                    </div>
                </div>

                <div class="control-group">
                    <h3>Canvas Size</h3>
                    <div class="control-row">
                        <label for="canvasWidth">Width:</label>
                        <input type="number" id="canvasWidth" value="800" min="100" max="1920" />
                    </div>
                    <div class="control-row">
                        <label for="canvasHeight">Height:</label>
                        <input type="number" id="canvasHeight" value="600" min="100" max="1080" />
                    </div>
                    <button id="resizeBtn">Resize</button>
                </div>
            </div>
        </div>

        <script type="module" src="demo.js"></script>
    </body>
</html>
