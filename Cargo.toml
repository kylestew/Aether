[package]
name = "aether"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3", features = ["hex"] }
typetag = "0.2"
bytemuck = "1"
rand = { version = "0.8", features = ["small_rng"] }
image = "0.25"
# base64 = "0.21"
getrandom = "0.2"

# --- native-only (desktop) ---
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.28"

# --- web-only (wasm32) ---
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["console"] }  # add more Web APIs as needed
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
